<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Date Me App</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container" style="padding-bottom: 80px;">
        <header class="app-header">
            <h1>🗓️ Schedule a Date</h1>
            <p id="welcome-text">Loading user profile...</p>
        </header>

        <div id="request-tab" class="tab-content">
            <form id="date-form" onsubmit="event.preventDefault();">

                <div class="form-group">
                    <label for="receiver-username">Who do you want to invite?</label>
                    <input type="text" id="receiver-username" placeholder="e.g. @username" required>
                    <small>Enter their precise Telegram @username.</small>
                </div>

                <div class="form-group">
                    <label for="date-time">When are you meeting?</label>
                    <input type="datetime-local" id="date-time" required>
                </div>

                <div class="form-group">
                    <label>Set Location on Map</label>
                    <div id="map"></div>
                    <small class="map-hint">Drag the map to place the pin precisely on your venue.</small>

                    <input type="hidden" id="latitude">
                    <input type="hidden" id="longitude">
                </div>

                <div class="form-group">
                    <label for="description">Why are you meeting?</label>
                    <textarea id="description" rows="3" placeholder="e.g. Let's grab iced lattes and talk about building our mini app!" required></textarea>
                </div>

                <button type="submit" id="submit-btn" class="primary-btn">Send Invite Request</button>
            </form>
        </div>

        <!-- 💡 TAB 2: APPOINTMENT LIST LAYOUT (HIDDEN BY DEFAULT) -->
        <div id="list-tab" class="tab-content" style="display: none; padding-top: 10px;">
            <h2 style="color: #fff; font-size: 1.3em; margin-bottom: 15px; border-bottom: 1px solid var(--tg-theme-hint-color, rgba(0,0,0,0.15)); padding-bottom: 8px;">📋 Your Scheduled Appointments</h2>
            <div id="appointments-loading" style="color: #888; text-align: center; margin: 20px 0;">Fetching your database records...</div>
            <div id="appointments-container"></div>
        </div>

        <!-- 💡 NEW TAB 3: DEDICATED DETAILS LAYOUT (HIDDEN BY DEFAULT) -->
        <div id="details-tab" class="tab-content" style="display: none; padding-top: 10px;">
            <!-- Back Button -->
            <button id="back-to-list-btn" style="background: none; border: none; color: var(--tg-theme-button-color, #2481cc); font-weight: bold; font-size: 15px; cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; gap: 5px;">
                ⬅️ Back to My Invites
            </button>

            <h2 style="color: #fff; font-size: 1.3em; margin-bottom: 15px; border-bottom: 1px solid var(--tg-theme-hint-color, rgba(0,0,0,0.15)); padding-bottom: 8px;">ℹ️ Appointment Info</h2>

            <!-- Read-Only Info Panel -->
            <div id="detailed-info-card" style="background-color: var(--tg-theme-secondary-bg-color, #ffffff); border: 1px solid var(--tg-theme-hint-color, rgba(0, 0, 0, 0.15)); border-radius: 12px; padding: 16px; margin-bottom: 16px;">
                <!-- Filled dynamically by JavaScript -->
            </div>

            <!-- Read-Only Map Section -->
            <div class="form-group">
                <label>📍 Meeting Location Location</label>
                <div id="details-map" style="width: 100%; height: 220px; border-radius: 12px; border: 1px solid var(--tg-theme-hint-color, #ccc); margin-top: 6px;"></div>
            </div>
        </div>
    </div>

    <div class="bottom-nav" style="position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: #111; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 9999; box-shadow: 0 -4px 10px rgba(0,0,0,0.5);">
        <button id="nav-request-btn" style="background: none; border: none; color: #4ade80; font-weight: bold; font-size: 15px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;">
            <span>📍</span> New Request
        </button>
        <button id="nav-list-btn" style="background: none; border: none; color: #888; font-weight: bold; font-size: 15px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;">
            <span>📋</span> My Invites
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
